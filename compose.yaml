services:
  dashboard:
    build: .
    ports: ["8501:8501"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    env_file:
      - path: .env
        required: false
  api:
    build: .
    command: python -m uvicorn flightlab.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    env_file:
      - path: .env
        required: false
